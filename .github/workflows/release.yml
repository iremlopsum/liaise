name: Release

# Publishes liaise to npm when a version bump lands on main, after the owner
# approves the `npm` environment; then tags, creates the GitHub Release and
# smoke-tests what npm serves. Publishing uses npm trusted publishing (OIDC):
# no npm token exists anywhere, and npm accepts only this file, in this repo,
# running in the `npm` environment.
# Design: the 2026-10-07 release-pipeline spec (local docs/superpowers/specs).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the checks, the gate and the approval, but only simulate the publish
        type: boolean
        default: true

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

# Two releases never interleave, and a queued one is not dropped.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Only main releases. Without this, a dispatch from another branch would rely
    # entirely on the npm environment's branch policy — a setting, not code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      release: ${{ steps.decide.outputs.release }}
      create_tag: ${{ steps.decide.outputs.create_tag }}
      latest: ${{ steps.decide.outputs.latest }}
      target: ${{ steps.decide.outputs.target }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repair path looks up the commit that introduced the version.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'push' }}
        run: node scripts/release-check.mjs --mode "$MODE" >> "$GITHUB_OUTPUT"

  # The full suite, once, before the owner is asked: approval means "ship this
  # green build". CI already ran the Node 20/22/24 matrix on the PR and the push.
  gate:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run test:run
      - run: npm run test:integration
      - run: npm run docs:check
      - run: npm run docs:types
      - run: npm run build
      - run: npm run size

  publish:
    needs: [check, gate]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # GitHub holds this job until the owner approves it.
    environment: npm
    permissions:
      contents: read
      # npm exchanges this OIDC token for a one-time publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache:` here: nothing restored from a cache may reach the tarball.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or newer (trusted publishing)
        run: |
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
      - run: npm ci
      - name: Publish
        env:
          DRY_RUN: ${{ needs.check.outputs.dry_run }}
          VERSION: ${{ needs.check.outputs.version }}
        # prepublishOnly runs the full suite again inside the publish, on purpose:
        # the tarball is built and tested in the job that ships it. A dry run
        # packs instead — npm refuses `publish --dry-run` for a version it
        # already has, and the gate job has run the suite. "Re-run failed jobs"
        # after a publish by hand finds the version on npm and moves on.
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run build && npm pack --dry-run
          elif [ -n "$(npm view "liaise@$VERSION" version 2>/dev/null)" ]; then
            echo "npm already has liaise@$VERSION; not publishing it again"
          else
            npm publish
          fi

  # After any real publish — by this run, or earlier (repair path): once npm has
  # the version, what it serves can be checked whoever published it.
  verify:
    needs: [check, publish]
    if: ${{ !cancelled() && needs.check.outputs.dry_run != 'true' && (needs.publish.result == 'success' || (needs.check.outputs.publish == 'false' && needs.check.outputs.release == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install from npm and smoke-test
        env:
          VERSION: ${{ needs.check.outputs.version }}
        # Copied out of the repo first: inside it, import('liaise') would load
        # the repo itself, not what npm serves. npm validates a new version for
        # minutes before serving it, so the install retries for up to twenty;
        # --prefer-online makes each retry ask the registry instead of reusing
        # the answer npm cached on the first, failed attempt (fresh for 5 min).
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir" && cp scripts/smoke-installed.mjs "$dir/" && cd "$dir"
          npm init -y > /dev/null
          for i in $(seq 1 40); do
            if npm install --prefer-online --no-audit --no-fund "liaise@$VERSION"; then break; fi
            if [ "$i" = 40 ]; then echo "::error::liaise@$VERSION was not installable after 20 minutes"; exit 1; fi
            sleep 30
          done
          node smoke-installed.mjs "$VERSION"

  # After verify, so GitHub announces a version only once npm serves it: npm
  # holds a new version as "Validating" for minutes after the publish (5.1.1:
  # about four), and installs fail until then.
  release:
    needs: [check, publish, verify]
    # Runs after a successful publish, or on the repair path (npm already has the
    # version, so publish was skipped). Never after a failed gate or publish.
    if: ${{ !cancelled() && needs.check.outputs.release == 'true' && (needs.publish.result == 'success' || needs.check.outputs.publish == 'false') && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The run's own commit: the CHANGELOG `check` validated, which the notes
      # come from. The tag names `target` explicitly (full history is fetched).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Both steps are safe to run twice ("Re-run failed jobs" reuses the old
      # check outputs): an existing tag on the right commit or an existing
      # Release is reported and skipped; a tag on another commit stops the run.
      - name: Tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ needs.check.outputs.target }}
        run: |
          if existing="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}")"; then
            if [ "$existing" = "$TARGET" ]; then
              echo "tag v$VERSION already points at $TARGET"
              exit 0
            fi
            echo "::error::tag v$VERSION points at $existing, not $TARGET; fix it by hand"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$TARGET"
          git push origin "v$VERSION"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists"
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          latest="--latest"
          [ "$LATEST" = "true" ] || latest="--latest=false"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$latest"

  # Docs go live with the version they describe. Must live here: a Release created with
  # GITHUB_TOKEN does not trigger other workflows. Only after `release` succeeded, so a
  # dry run (release skipped) or a failed publish never deploys; and only for the newest
  # version (`latest`), so repairing an older release never puts its docs back up.
  # Two jobs: the build installs and runs the site's third-party packages, so it holds no
  # token that can deploy; the deploy job runs nothing but actions/deploy-pages.
  docs-build:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.outputs.dry_run != 'true' && needs.check.outputs.latest == 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.target }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm ci --prefix site && npm --prefix site run build && npm --prefix site test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  docs-deploy:
    needs: docs-build
    # Explicit: on the repair path `publish` was skipped, and the default success() would
    # skip this job for it too.
    if: ${{ !cancelled() && needs.docs-build.result == 'success' }}
    # Shares the group with docs.yml's deploy: the two never deploy at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
